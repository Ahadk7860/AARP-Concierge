openapi: 3.1.0
info:
  title: Boi cloud API
  version: "1.0.0"
  description: >
    Thin ingest and pairing surface. Produced by Track D. Consumed by Track A (Mac
    uploads) and Track C (webhook delivery). Every endpoint is partitioned by user_id;
    delete is a partition drop.
servers:
  - url: http://localhost:3041
    description: Track D dev server
paths:
  /v1/digest:
    post:
      summary: Upload a T0 digest from the Mac
      security: [{ deviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schema/digest.v1.json" }
      responses:
        "202": { description: accepted, content: { application/json: { schema: { type: object, required: [digest_id, received_at], properties: { digest_id: {type: string}, received_at: {type: string, format: date-time} } } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "duplicate generated_at for this device; ignored", content: { application/json: { schema: { type: object, properties: { error: {const: duplicate} } } } } }
  /v1/voice-pack:
    post:
      summary: Upload one voice pack (T1.5)
      description: >
        Server MUST reject any exemplar array that fails the redaction assertions.
        This endpoint is the second of the three is_from_me guards; the Mac holds the
        first and the build test holds the third.
      security: [{ deviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schema/voice_pack.v1.json" }
      responses:
        "202": { description: accepted }
        "400": { $ref: "#/components/responses/Validation" }
        "422":
          description: "redaction assertion failed — pack rejected and NOT stored"
          content:
            application/json:
              schema:
                type: object
                required: [error, detail]
                properties:
                  error: { const: redaction_failed }
                  detail: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/heartbeat:
    post:
      summary: Mac liveness ping
      security: [{ deviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            # Was inline here, the one endpoint on this document without a file in
            # contracts/schema/ backing it — which meant differential.test.ts (it only
            # ever reads contracts/schema/*.json) had never once checked the zod mirror
            # against this shape. Extracted to ../schema/heartbeat.v1.json, same as
            # every other request body below, so it gets the same guarantee.
            schema: { $ref: "../schema/heartbeat.v1.json" }
      responses:
        "204": { description: ok }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/pair:
    post:
      summary: Exchange a six-digit pairing code for a device token
      description: Single use, 10 minute expiry, bound server-side to one user_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, device_id]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
                device_id: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [user_id, device_token, user_salt]
                properties:
                  user_id: { type: string }
                  device_token: { type: string }
                  user_salt:
                    type: string
                    description: >
                      Per-user salt for contact_id = HMAC(user_salt, normalized_handle).
                      Issued once. The same phone number yields a different contact_id
                      for every user, so cross-user joins are arithmetically unavailable.
        "404": { description: "unknown, expired, or already-used code", content: { application/json: { schema: { type: object, properties: { error: { const: invalid_code } } } } } }
  /v1/users/{user_id}:
    delete:
      summary: Delete everything, derived data included
      security: [{ deviceToken: [] }]
      parameters: [{ name: user_id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: "partition dropped" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/webhooks/{provider}:
    post:
      summary: Inbound from a transport provider
      description: >
        Track C owns signature verification and normalization; Track D owns what
        happens to the normalized message. The boundary is the inbound.v1 shape.
      parameters:
        - { name: provider, in: path, required: true, schema: { enum: [linq, mock, twilio] } }
        - { name: X-Boi-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "204": { description: accepted }
        "401": { description: "signature verification failed", content: { application/json: { schema: { type: object, properties: { error: { const: bad_signature } } } } } }
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
  responses:
    Validation:
      description: malformed input
      content:
        application/json:
          schema:
            type: object
            required: [error, detail]
            properties:
              error: { const: validation }
              detail: { type: string }
    Unauthorized:
      description: missing or invalid credential
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { const: unauthorized }
