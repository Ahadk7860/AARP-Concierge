openapi: 3.1.0
info:
  title: Linq Partner API v3 — the subset Boi uses
  version: "3.0.0-subset"
  description: >
    UNVERIFIED AGAINST A LIVE ACCOUNT. Reconstructed from docs.linqapp.com as of
    1 August 2026; tokens are provisioned by a Linq representative and were not
    available at authoring time. Track C's mock server implements exactly this
    document. When a real token lands, the FIRST task is to diff a live response
    against contracts/transcripts/ and amend this file through the contract
    amendment procedure — not to patch the adapter.
servers:
  - url: https://api.linqapp.com/api/partner/v3
    description: production (no token yet)
  - url: http://localhost:3031
    description: Track C mock server
paths:
  /chats:
    post:
      summary: Send a message
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, message]
              properties:
                from: { type: string, description: "E.164 line handle" }
                to:
                  type: array
                  minItems: 1
                  items: { type: string, description: "E.164 phone or email" }
                message:
                  type: object
                  required: [parts]
                  properties:
                    parts:
                      type: array
                      minItems: 1
                      items:
                        oneOf:
                          - { type: object, required: [type, text], properties: { type: { const: text }, text: { type: string } } }
                          - { type: object, required: [type, url], properties: { type: { const: media }, url: { type: string }, mime: { type: string } } }
                          - { type: object, required: [type, contact], properties: { type: { const: contact_card }, contact: { type: object } } }
                    reply_to: { type: [string, "null"] }
                    protocol:
                      type: string
                      enum: [auto, imessage, rcs, sms]
                      default: auto
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [id, status, protocol]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [queued, sent, failed] }
                  protocol: { type: string, enum: [imessage, rcs, sms] }
                  trace_id: { type: string }
        "401": { description: bad token }
        "429":
          description: rate limited
          headers:
            Retry-After: { schema: { type: integer } }
        "503":
          description: "line unavailable — the failure mode that actually hurts"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [line_banned, line_degraded, upstream] }
                  line_id: { type: string }
  /chats/{id}:
    get:
      summary: Fetch send status
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [queued, sent, delivered, read, failed] }
                  protocol: { type: string, enum: [imessage, rcs, sms] }
  /lines:
    get:
      summary: "Line health. SHAPE UNVERIFIED — see UNRESOLVED in prompts/CONTRACTS.md"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        handle: { type: string }
                        status: { type: string, enum: [up, degraded, banned] }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
