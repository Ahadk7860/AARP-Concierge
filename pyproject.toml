[project]
name = "boi-intelligence"
version = "0.1.0"
description = "Boi intelligence layer — voice pack, gist, drafter, validator, eval."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Live model calls. Only Track B is permitted to make them (CONTRACTS.md section 9).
live = ["google-genai>=1.0"]
# The local gist model. Apple Silicon only; there is a CPU fallback path.
local = ["mlx-lm>=0.19; platform_machine == 'arm64'"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["intelligence"]

[tool.pytest.ini_options]
testpaths = ["intelligence/tests"]
pythonpath = ["intelligence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
